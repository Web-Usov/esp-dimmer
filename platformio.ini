[platformio]
default_envs = nodemcuv2

[env]
framework = arduino
monitor_speed = 115200

[env:nodemcuv2]
platform = espressif8266 @ 4.2.1
board = nodemcuv2

; Target: ESP32-C3 SuperMini (generic-совместимый board).
; Распиновку кандидата см. docs/wiring.md — сверить перед пайкой.
[env:esp32c3]
platform = espressif32 @ 7.0.1
board = esp32-c3-devkitm-1

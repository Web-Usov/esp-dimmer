[platformio]
default_envs = esp32c3

[env]
framework = arduino
monitor_speed = 115200

; Legacy / compatibility: NodeMCU ESP8266.
[env:nodemcuv2]
platform = espressif8266 @ 4.2.1
board = nodemcuv2

; Primary / production: ESP32-C3 SuperMini (generic-совместимый board).
; Распиновка: docs/wiring.md. USB CDC → Serial на native USB (не UART0 / GPIO20).
[env:esp32c3]
platform = espressif32 @ 7.0.1
board = esp32-c3-devkitm-1
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

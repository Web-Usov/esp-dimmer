[platformio]
default_envs = nodemcuv2

[env]
framework = arduino
monitor_speed = 115200

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2

; Будущая целевая плата финального многоканального контроллера.
; ESP32-C3 SuperMini обычно совместимы с этим generic-таргетом.
; Распиновку сверить перед переносом железа.
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1

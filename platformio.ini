[platformio]
default_envs = nodemcuv2

[env]
framework = arduino
monitor_speed = 115200

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2

; Future target for the final multi-channel controller.
; ESP32-C3 SuperMini boards are commonly compatible with this generic target.
; Pin mapping will be verified before hardware migration.
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1

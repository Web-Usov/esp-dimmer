name: Release ESP32-C3

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.0"
        required: true
        type: string
      prerelease:
        description: "Mark release as prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          python -m pip install "platformio==6.1.19"

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG"
            echo "Expected SemVer-like tag, e.g. v0.1.0 or v0.1.0-rc.1"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Build ESP32-C3 firmware
        run: pio run -e esp32c3

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ steps.meta.outputs.tag }}"
          BUILD_DIR=".pio/build/esp32c3"
          DIST_DIR="dist"

          mkdir -p "$DIST_DIR"

          cp "$BUILD_DIR/firmware.bin" \
            "$DIST_DIR/esp-dimmer-${TAG}-firmware.bin"

          ESPTOOL="$HOME/.platformio/packages/tool-esptoolpy/esptool.py"
          BOOT_APP0="$(find "$HOME/.platformio/packages/framework-arduinoespressif32" -name boot_app0.bin -print -quit)"

          test -f "$ESPTOOL"
          test -f "$BOOT_APP0"
          test -f "$BUILD_DIR/bootloader.bin"
          test -f "$BUILD_DIR/partitions.bin"
          test -f "$BUILD_DIR/firmware.bin"

          python "$ESPTOOL" --chip esp32c3 merge_bin \
            -o "$DIST_DIR/esp-dimmer-${TAG}-full.bin" \
            --flash_mode dio \
            --flash_freq 80m \
            --flash_size 4MB \
            0x0000 "$BUILD_DIR/bootloader.bin" \
            0x8000 "$BUILD_DIR/partitions.bin" \
            0xe000 "$BOOT_APP0" \
            0x10000 "$BUILD_DIR/firmware.bin"

          (
            cd "$DIST_DIR"
            sha256sum *.bin > SHA256SUMS.txt
          )

          ls -lh "$DIST_DIR"
          cat "$DIST_DIR/SHA256SUMS.txt"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp-dimmer-${{ steps.meta.outputs.tag }}
          path: dist/
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
        shell: bash
        run: |
          set -euo pipefail

          EXTRA_ARGS=()
          if [[ "$PRERELEASE" == "true" ]]; then
            EXTRA_ARGS+=(--prerelease)
          fi

          gh release create "$RELEASE_TAG" \
            dist/* \
            --target "$GITHUB_SHA" \
            --title "ESP Dimmer $RELEASE_TAG" \
            --generate-notes \
            "${EXTRA_ARGS[@]}"

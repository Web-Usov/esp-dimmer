name: Release ESP32-C3

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.0"
        required: true
        type: string
      prerelease:
        description: "Mark release as prerelease"
        required: false
        default: false
        type: boolean

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          python -m pip install "platformio==6.1.19"

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
            INPUT_PRERELEASE="${{ inputs.prerelease }}"
          else
            TAG="${GITHUB_REF_NAME}"
            INPUT_PRERELEASE="false"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG"
            echo "Expected SemVer-like tag, e.g. v0.1.0 or v0.1.0-rc.1"
            exit 1
          fi

          PRERELEASE="false"
          if [[ "$TAG" == *-* || "$INPUT_PRERELEASE" == "true" ]]; then
            PRERELEASE="true"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"
          echo "Prerelease: $PRERELEASE"

      - name: Build ESP32-C3 firmware
        run: pio run -e esp32c3

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ steps.meta.outputs.tag }}"
          BUILD_DIR=".pio/build/esp32c3"
          DIST_DIR="dist"

          mkdir -p "$DIST_DIR"

          cp "$BUILD_DIR/firmware.bin" \
            "$DIST_DIR/esp-dimmer-${TAG}-firmware.bin"

          ESPTOOL="$HOME/.platformio/packages/tool-esptoolpy/esptool.py"
          BOOT_APP0="$(find "$HOME/.platformio/packages/framework-arduinoespressif32" -name boot_app0.bin -print -quit)"

          test -f "$ESPTOOL"
          test -f "$BOOT_APP0"
          test -f "$BUILD_DIR/bootloader.bin"
          test -f "$BUILD_DIR/partitions.bin"
          test -f "$BUILD_DIR/firmware.bin"

          python "$ESPTOOL" --chip esp32c3 merge_bin \
            -o "$DIST_DIR/esp-dimmer-${TAG}-full.bin" \
            --flash_mode dio \
            --flash_freq 80m \
            --flash_size 4MB \
            0x0000 "$BUILD_DIR/bootloader.bin" \
            0x8000 "$BUILD_DIR/partitions.bin" \
            0xe000 "$BOOT_APP0" \
            0x10000 "$BUILD_DIR/firmware.bin"

          (
            cd "$DIST_DIR"
            sha256sum *.bin > SHA256SUMS.txt
          )

          ls -lh "$DIST_DIR"
          cat "$DIST_DIR/SHA256SUMS.txt"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp-dimmer-${{ steps.meta.outputs.tag }}
          path: dist/
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail

          EXTRA_ARGS=()
          if [[ "$PRERELEASE" == "true" ]]; then
            EXTRA_ARGS+=(--prerelease)
          fi

          gh release create "$RELEASE_TAG" \
            dist/* \
            --target "$GITHUB_SHA" \
            --title "ESP Dimmer $RELEASE_TAG" \
            --generate-notes \
            "${EXTRA_ARGS[@]}"

      - name: Prepare stable Web Installer site
        if: steps.meta.outputs.prerelease == 'false'
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          SITE_DIR="site"
          mkdir -p "$SITE_DIR/firmware"

          cp installer/index.html "$SITE_DIR/index.html"
          cp "dist/esp-dimmer-${RELEASE_TAG}-full.bin" \
            "$SITE_DIR/firmware/esp-dimmer-full.bin"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          template = Path("installer/manifest.template.json")
          output = Path("site/manifest.json")
          release_tag = os.environ["RELEASE_TAG"]

          data = json.loads(template.read_text(encoding="utf-8"))
          data["version"] = release_tag.removeprefix("v")
          output.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

          printf '%s\n' "$RELEASE_TAG" > "$SITE_DIR/version.txt"
          (
            cd "$SITE_DIR/firmware"
            sha256sum esp-dimmer-full.bin > SHA256SUMS.txt
          )

          find "$SITE_DIR" -maxdepth 2 -type f -print
          cat "$SITE_DIR/manifest.json"

      - name: Upload Web Installer Pages artifact
        if: steps.meta.outputs.prerelease == 'false'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy-pages:
    name: Deploy Web Installer
    if: needs.release.outputs.prerelease == 'false'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
